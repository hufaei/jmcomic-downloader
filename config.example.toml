# 复制为 config.toml 后填写实际编号与首帧图片路径。
[download]
album_ids = ["123456"]

[output]
directory = "./download"
format = "images" # images | pdf | zip | long_image

[network]
image_threads = 10
photo_threads = 3
retry_times = 5

[apng]
enabled = false
first_frame = "/absolute/path/to/first-frame.png"
file_name = "apng-{album_id}.png"
frame_duration_ms = 3000
max_chapters = 5 # 0 表示全部章节
split_parts = 3  # 1 表示不拆分

# 质量优先设置。limit_size = true 时启用目标体积自适应。
max_side = 1080
min_side = 600
hard_min_side = 480
palette_colors = 0 # 0 表示保留原始色彩
limit_size = false
target_source_ratio = 0.333333
minimum_target_size_mb = 30
maximum_target_size_mb = 50
